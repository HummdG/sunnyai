<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beacon Renewables — a React host page</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #171717;
      }
      header {
        padding: 18px 24px;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      nav {
        margin-left: auto;
        display: flex;
        gap: 18px;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 40px 24px 120px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 24px 0;
      }
      .controls button {
        font: inherit;
        font-size: 14px;
        padding: 9px 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        background: #fff;
        cursor: pointer;
      }
      .note {
        font-family: ui-monospace, monospace;
        font-size: 13px;
        color: #6b7280;
      }
      footer {
        border-top: 1px solid #e5e7eb;
        padding: 28px 24px;
        color: #6b7280;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/app.js"></script>
  </body>
</html>
